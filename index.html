<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sixth Ward Tool Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/styles.css">
</head>
<body class="min-h-screen bg-surface font-body text-ink antialiased">
  <main class="min-h-screen bg-surface">
    <div id="header-mount"></div>

    <section class="flex w-full flex-col gap-lg bg-white p-xl">
      <h1 class="font-display text-xl font-semibold leading-[1.2] text-ink">Browse the catalog</h1>

      <div class="flex items-center gap-md">
        <span id="category-filter-mount"></span>
        <span id="name-filter-mount"></span>

        <label class="inline-flex items-center gap-sm">
          <input id="available-only" type="checkbox" class="h-5 w-5 rounded-sm border border-border bg-surface-raised text-accent focus:ring-2 focus:ring-[#dfeae7]" />
          <span class="text-base text-ink">Available only</span>
        </label>
      </div>

      <p id="result-count" aria-live="polite" class="text-sm text-ink-muted">0 tools</p>

      <div id="tool-grid" class="grid w-[1008px] grid-cols-3 gap-lg"></div>
    </div>
  </main>

  <script src="src/components.js"></script>
  <script>
    const availableOnlyInput = document.getElementById('available-only');
    const toolGrid = document.getElementById('tool-grid');
    const resultCount = document.getElementById('result-count');

    document.getElementById('header-mount').replaceWith(
      window.SixthWardComponents.renderHeader()
    );

    const categoryFilterComponent = window.SixthWardComponents.renderFilterField({
      type: 'Select',
      id: 'category-filter',
      ariaLabel: 'Category',
      options: [{ value: 'all', label: 'All categories' }]
    });
    const nameFilterComponent = window.SixthWardComponents.renderFilterField({
      type: 'Search',
      id: 'name-filter',
      ariaLabel: 'Search tools by name'
    });
    const categoryFilter = categoryFilterComponent.firstElementChild;
    const nameFilterInput = nameFilterComponent.firstElementChild;

    document.getElementById('category-filter-mount').replaceWith(categoryFilterComponent);
    document.getElementById('name-filter-mount').replaceWith(nameFilterComponent);

    const formatDueBack = (dateString) => {
      if (!dateString) return '';
      const value = new Date(dateString + 'T00:00:00');
      return new Intl.DateTimeFormat('en-US', { month: 'long', day: 'numeric' }).format(value);
    };

    const getMetaLine = (tool) => {
      if (tool.availability === 'checked_out' && tool.due_back) {
        return `Due back ${formatDueBack(tool.due_back)}`;
      }

      if (tool.availability === 'repair') {
        return 'This tool is out for repair.';
      }

      if (tool.id === 'cordless-drill') {
        return 'Deposit $40 held at pickup';
      }

      const flags = [];

      if (tool.members_only) flags.push('Members only');
      if (tool.requires_orientation) flags.push('Orientation required');
      if (tool.deposit > 0 && tool.id !== 'extension-ladder') flags.push(`Deposit $${tool.deposit}`);

      if (flags.length) {
        return flags.length > 1 ? `${flags.join('. ')}.` : flags[0];
      }

      return 'No deposit';
    };

    const renderCard = (tool, categoryLabel) => {
      return window.SixthWardComponents.renderToolCard({
        id: tool.id,
        name: tool.name,
        category: tool.category,
        categoryLabel,
        availability: tool.availability,
        metaLine: getMetaLine(tool)
      });
    };

    const updateFilters = (tools, categories) => {
      const selectedCategory = categoryFilter.value;
      const availableOnly = availableOnlyInput.checked;
      const query = nameFilterInput.value.trim().toLowerCase();

      const filtered = tools.filter((tool) => {
        const matchesCategory = selectedCategory === 'all' || tool.category === selectedCategory;
        const matchesAvailable = !availableOnly || tool.availability === 'available';
        const matchesQuery = tool.name.toLowerCase().includes(query);
        return matchesCategory && matchesAvailable && matchesQuery;
      });

      toolGrid.innerHTML = '';

      if (!filtered.length) {
        resultCount.textContent = '0 tools';
        return;
      }

      resultCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'tool' : 'tools'}`;

      const categoryById = Object.fromEntries(categories.map((category) => [category.id, category.label]));

      filtered.forEach((tool) => {
        toolGrid.appendChild(renderCard(tool, categoryById[tool.category] || tool.category));
      });
    };

    fetch('data/tools.json')
      .then((response) => {
        if (!response.ok) {
          throw new Error('Unable to load tool catalog');
        }
        return response.json();
      })
      .then((data) => {
        const categories = data.categories || [];
        const tools = (data.tools || []).filter((tool) => tool.availability !== 'retired');

        categories.forEach((category) => {
          const option = document.createElement('option');
          option.value = category.id;
          option.textContent = category.label;
          categoryFilter.appendChild(option);
        });

        categoryFilter.addEventListener('change', () => updateFilters(tools, categories));
        availableOnlyInput.addEventListener('change', () => updateFilters(tools, categories));
        nameFilterInput.addEventListener('input', () => updateFilters(tools, categories));

        updateFilters(tools, categories);
      })
      .catch((error) => {
        console.error(error);
        resultCount.textContent = 'Unable to load tools';
      });
  </script>
</body>
</html>
