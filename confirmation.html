<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold confirmation | Sixth Ward Tool Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/styles.css">
</head>
<body class="min-h-screen page-base font-body text-ink antialiased">
  <main class="min-h-screen page-base">
    <div id="header-mount"></div>

    <section class="flex w-full justify-center bg-white p-lg md:p-xl">
      <div class="flex w-full max-w-160 flex-col items-start gap-md overflow-hidden rounded-card border border-border bg-surface-raised p-lg md:p-xl">
        <div id="hold-badge"></div>
        <h1 class="font-display text-lg md:text-xl font-semibold leading-[1.2] text-ink">Your hold is placed</h1>
        <p id="tool-name" class="font-display text-lg font-semibold leading-[1.3] text-ink"></p>
        <p class="text-base leading-[1.5] text-ink-muted">Pick this up within 3 days. After that the hold is released.</p>

        <div id="what-to-bring" class="flex w-full flex-col items-start gap-sm overflow-hidden bg-white pt-sm" hidden>
          <p class="w-full text-base leading-[1.5] text-ink">What to bring</p>
        </div>

        <a class="inline-flex items-center rounded-sm border border-border bg-surface-raised px-lg py-md font-body text-base font-semibold leading-[1.2] text-ink hover:bg-surface" href="index.html">Back to catalog</a>
      </div>
    </section>
  </main>

  <script src="src/components.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const toolId = params.get('id');
    const components = window.SixthWardComponents;

    document.getElementById('header-mount').replaceWith(components.renderHeader());
    document.getElementById('hold-badge').appendChild(components.renderBadge('OnHold'));

    const addBringItem = (text) => {
      const item = document.createElement('p');
      item.className = 'w-full text-sm leading-[1.45] text-ink-muted';
      item.textContent = text;
      document.getElementById('what-to-bring').appendChild(item);
    };

    fetch('data/tools.json')
      .then((response) => {
        if (!response.ok) throw new Error('Unable to load tool catalog');
        return response.json();
      })
      .then((data) => {
        const tool = (data.tools || []).find((item) => item.id === toolId);
        if (!tool || tool.availability === 'retired' || tool.availability === 'repair') {
          window.location.replace('index.html');
          return;
        }

        document.title = `${tool.name} hold | Sixth Ward Tool Library`;
        document.getElementById('tool-name').textContent = tool.name;

        const whatToBring = document.getElementById('what-to-bring');
        if (tool.members_only) addBringItem('Your Sixth Ward membership card');
        if (tool.deposit > 0) addBringItem(`A $${tool.deposit} refundable deposit`);
        if (tool.requires_orientation) {
          addBringItem('Proof of completed safety orientation, or arrive 20 minutes early to complete it');
        }
        whatToBring.hidden = whatToBring.children.length === 1;
      })
      .catch(() => window.location.replace('index.html'));
  </script>
</body>
</html>
